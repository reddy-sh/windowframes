name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build universal app and zip
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WindowFrames
          path: |
            build/WindowFrames-*.zip
            build/WindowFrames-*.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WindowFrames
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WindowFrames $GITHUB_REF_NAME" \
            --notes "Download WindowFrames-*.zip, then follow the install steps in the README."
